<h2>Undo</h2>
<p>The <i>undo</i> operation (<i></i><i>Ctrl-Z</i>) will undo most
mouse and keyboard operations, Operations that will <i>not</i> be
undone, are those:</p>
<ul><li>Exit (!)<br>
  </li>
</ul>
<p>You can undo the last 32 operations. There is also a Redo
mechanism, where the last undone operations can be redone.<br>
</p>
