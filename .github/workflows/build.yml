name: Build xcalc for Windows

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 1. Code auschecken
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. make installieren
      - name: Install make
        run: choco install make -y

      # 3. Qt 6.7.0 installieren
      - name: Install Qt 6.7.0
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'

      # 4. Umgebung einrichten (✅ FIX: Kein doppeltes \mingw_64\ mehr!)
      - name: Set up environment
        run: |
          echo "$env:QT_ROOT_DIR\bin" >> $GITHUB_PATH  # ⭐ Nur "\bin", nicht "\mingw_64\bin"!
          echo "Qt installed at: $env:QT_ROOT_DIR"
          Get-ChildItem "$env:QT_ROOT_DIR\bin"
        shell: pwsh

      # 5. Kompilieren (✅ FIX: qtenv2.bat aus dem richtigen Pfad)
      - name: Build
        run: |
          call "$env:QT_ROOT_DIR\bin\qtenv2.bat"  # ⭐ Nur "\bin", nicht "\mingw_64\bin"!
          qmake6 xcalc.pro -spec win32-g++
          make release
        shell: cmd

      # 6. .exe hochladen
      - name: Upload executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xcalc-windows
          path: release/xcalc.exe
