name: Build xcalc for Windows (MSVC, ZIP Qt)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # MSVC aktivieren
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Qt 6.6.3 MSVC herunterladen
      - name: Download Qt 6.6.3 MSVC
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://download.qt.io/online/qtsdkrepository/windows_x64/desktop/qt6_663/qt.qt6.663.win64_msvc/6.6.3-0-202403190914qtbase-Windows-MSVC2022-Windows-Windows_10-MSVC2022-X86_64.7z" `
            -OutFile "qtbase.7z"

      # Entpacken
      - name: Extract Qt
        run: |
          7z x qtbase.7z -oQt

      # Build
      - name: Build with MSVC
        shell: cmd
        run: |
          call "Qt\bin\qtenv2.bat"
          qmake6 xcalc.pro -spec win32-msvc
          nmake

      # Artefakt hochladen
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: xcalc-windows-msvc
          path: xcalc.exe
