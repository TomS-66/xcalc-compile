name: Build xcalc for Windows (Qt 6.11.1 via svenstaro/setup-qt)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install make (choco)
        run: choco install make -y
        shell: pwsh

      - name: Setup Qt (svenstaro/setup-qt)
        uses: svenstaro/setup-qt@v2
        with:
          version: '6.11.1'
          host: 'windows'
          target: 'windows'
          arch: 'x64'
          toolchain: 'mingw'      # request MinGW kit
          components: 'qtbase'    # add other modules with semicolon if needed

      - name: Ensure Qt MinGW bin in PATH
        run: |
          if (Test-Path "$env:QTDIR\mingw_64\bin") {
            "$env:QTDIR\mingw_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            "$env:QTDIR\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
        shell: pwsh

      - name: "Debug: show Qt and toolchain info"
        run: |
          echo QTDIR = %QTDIR%
          where qmake6 || where qmake
          where mingw32-make || where make
          qmake6 -v || qmake -v
        shell: cmd

      - name: Build with qmake (release)
        run: |
          cd %GITHUB_WORKSPACE%
          if not exist xcalc.pro (
            echo "ERROR: xcalc.pro not found in repository root" & exit /b 1
          )
          call "%QTDIR%\bin\qtenv2.bat"
          qmake6 xcalc.pro -spec win32-g++
          mingw32-make release
        shell: cmd

      - name: Verify built exe
        run: |
          if exist release\xcalc.exe (
            echo "Found release\xcalc.exe"
          ) else if exist build\release\xcalc.exe (
            echo "Found build\release\xcalc.exe"
          ) else if exist xcalc.exe (
            echo "Found xcalc.exe in repo root"
          ) else (
            echo "ERROR: Built exe not found. Listing directory:" & dir & exit /b 1
          )
        shell: cmd

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: xcalc-windows-x64
          path: |
            release/xcalc.exe
            build/release/xcalc.exe
            xcalc.exe
