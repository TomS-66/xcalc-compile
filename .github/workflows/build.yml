name: Build xcalc for Windows

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 1. Code auschecken
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. make installieren
      - name: Install make
        run: choco install make -y

      # 3. Qt 6.5.2 installieren (✅ STABILE VERSION + ÄLTERE ACTION)
      - name: Install Qt 6.5.2
        id: qt
        uses: jurplel/install-qt-action@v2  # ⭐ v2 statt v3 (keine SSL-Probleme!)
        with:
          version: '6.5.2'  # ⭐ 6.5.2 ist stabiler als 6.7.0
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'

      # 4. Umgebung einrichten
      - name: Set up environment
        run: |
          echo "QT_DIR=${{ steps.qt.outputs.qt-dir }}" >> $GITHUB_ENV
          echo "${{ steps.qt.outputs.qt-dir }}\bin" >> $GITHUB_PATH
        shell: pwsh

      # 5. Debug: Pfade prüfen
      - name: Debug paths
        run: |
          echo Arbeitsverzeichnis: %cd%
          echo QT_DIR=%QT_DIR%
          where qmake6
          where make
          dir
        shell: cmd

      # 6. Kompilieren
      - name: Build
        run: |
          cd %GITHUB_WORKSPACE%
          call "%QT_DIR%\bin\qtenv2.bat"
          qmake6 xcalc.pro -spec win32-g++
          make release
        shell: cmd

      # 7. .exe hochladen
      - name: Upload executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xcalc-windows
          path: release/xcalc.exe
