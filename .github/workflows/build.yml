name: Build xcalc for Windows

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 1. Code auschecken
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. make installieren
      - name: Install make
        run: choco install make -y

      # 3. Qt 6 installieren (via Chocolatey - zuverlässig!)
      - name: Install Qt 6
        run: choco install qt6 -y --version=6.4.3
        shell: cmd

      # 4. Qt-Pfad finden und Umgebung einrichten
      - name: Set up Qt environment
        run: |
          for /f "delims=" %%i in ('where qmake6') do set QMAKE_PATH=%%i
          for %%i in ("%QMAKE_PATH%") do set QT_BIN=%%~dpi
          echo Using Qt at: %QT_BIN%
          set PATH=%QT_BIN%;%PATH%
          call "%QT_BIN%\qtenv2.bat"
        shell: cmd

      # 5. Kompilieren
      - name: Build
        run: |
          qmake6 xcalc.pro -spec win32-g++
          make release
        shell: cmd

      # 6. .exe hochladen
      - name: Upload executable
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: xcalc-windows
          path: release/xcalc.exe
          
