name: Build xcalc for Windows (MSYS2 + Qt6, robust)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MSYS2 and refresh env
        shell: pwsh
        run: |
          choco install msys2 -y
          refreshenv

      - name: Determine MSYS2 path
        id: msys-path
        shell: pwsh
        run: |
          $pathsToCheck = @(
            "$env:ChocolateyInstall\msys64",
            "$env:ProgramFiles\msys64",
            "C:\tools\msys64",
            "C:\Program Files\msys64"
          )
          $found = $null
          foreach ($p in $pathsToCheck) {
            if (Test-Path $p) { $found = $p; break }
          }
          if (-not $found) {
            Write-Host ('No msys64 found in common locations. Defaulting to C:\tools\msys64')
            $found = "C:\tools\msys64"
          }
          Write-Host ('MSYS2 path: ' + $found)
          "msys=$found" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Update MSYS2 and install Qt6 packages (explicit)
        shell: pwsh
        run: |
          $msys = "${{ steps.msys-path.outputs.msys }}"
          $bash = Join-Path $msys "usr\bin\bash.exe"
          if (-not (Test-Path $bash)) { Write-Host ('ERROR: bash.exe not found at ' + $bash); exit 1 }
          Write-Host ('Using bash: ' + $bash)
          & $bash -lc "pacman -Syu --noconfirm" || true
          & $bash -lc "pacman -Su --noconfirm" || true
          & $bash -lc "pacman -S --noconfirm mingw-w64-x86_64-toolchain mingw-w64-x86_64-qt6 mingw-w64-x86_64-qt6-base mingw-w64-x86_64-qt6-tools mingw-w64-x86_64-make"
          $mingwBin = Join-Path $msys "mingw64\bin"
          if (Test-Path $mingwBin) {
            "$mingwBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host ('Added ' + $mingwBin + ' to PATH')
          } else {
            Write-Host ('Warning: ' + $mingwBin + ' not found after pacman install')
          }

      - name: List repo root (quick check)
        shell: pwsh
        run: |
          Write-Host 'Repository root listing (top-level):'
          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Force | Select-Object Name,Mode,Length | Format-Table -AutoSize

      - name: Find .pro file recursively
        id: find-pro
        shell: pwsh
        run: |
          $repo = $env:GITHUB_WORKSPACE
          $pro = Get-ChildItem -Path $repo -Filter *.pro -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $pro) {
            Write-Host 'ERROR: No .pro file found in repository (searched recursively).'
            exit 1
          }
          Write-Host ('Found .pro: ' + $pro.FullName)
          $rel = $pro.FullName.Substring($repo.Length).TrimStart('\','/')
          Write-Host ('Relative path: ' + $rel)
          "PRO_PATH=$rel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Debug: show qmake versions and Qt6 folders
        shell: pwsh
        run: |
          $msys = "${{ steps.msys-path.outputs.msys }}"
          $qmakePaths = @(
            Join-Path $msys "mingw64\bin\qmake6.exe",
            Join-Path $msys "mingw64\bin\qmake.exe",
            "qmake6",
            "qmake"
          )
          foreach ($p in $qmakePaths) {
            try {
              $cmd = (Get-Command $p -ErrorAction SilentlyContinue).Source
              if ($cmd) {
                Write-Host ('Found qmake candidate: ' + $p + ' -> ' + $cmd)
                & $cmd -v 2>&1 | ForEach-Object { Write-Host ('  ' + $_) }
              } else {
                Write-Host ('qmake candidate not on PATH: ' + $p)
              }
            } catch {
              Write-Host ('qmake candidate check failed for: ' + $p)
            }
          }
          $maybeQtDirs = @(
            Join-Path $msys "mingw64\lib\qt6",
            Join-Path $msys "mingw64\lib\cmake\Qt6",
            Join-Path $msys "mingw64\lib\qt6\plugins"
          )
          foreach ($d in $maybeQtDirs) {
            if (Test-Path $d) {
              Write-Host ('Exists: ' + $d)
              Get-ChildItem -Path $d -Force -ErrorAction SilentlyContinue | Select-Object Name | ForEach-Object { Write-Host ('  ' + $_.Name) }
            } else {
              Write-Host ('Not found: ' + $d)
            }
