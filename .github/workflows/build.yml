name: Build xcalc for Windows (MSYS2 + Qt6, robust)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MSYS2 (choco) and refresh env
        shell: pwsh
        run: |
          choco install msys2 -y
          refreshenv
          Write-Host "ChocolateyInstall = $env:ChocolateyInstall"
          Write-Host "ProgramFiles = $env:ProgramFiles"

      - name: Determine MSYS2 path and update
        id: msys-path
        shell: pwsh
        run: |
          $pathsToCheck = @(
            "$env:ChocolateyInstall\msys64",
            "$env:ProgramFiles\msys64",
            "C:\tools\msys64",
            "C:\Program Files\msys64"
          )
          $found = $null
          foreach ($p in $pathsToCheck) {
            if (Test-Path $p) { $found = $p; break }
          }
          if (-not $found) {
            Write-Host "No existing msys64 found in common locations. Defaulting to C:\tools\msys64"
            $found = "C:\tools\msys64"
          }
          Write-Host "MSYS2 path: $found"
          # Use the recommended way to set outputs from GitHub Actions in PowerShell
          "msys=$found" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Update MSYS2 and install packages (mingw64 toolchain + Qt6)
        shell: pwsh
        run: |
          $msys = "${{ steps.msys-path.outputs.msys }}"
          $bash = Join-Path $msys "usr\bin\bash.exe"
          if (-not (Test-Path $bash)) {
            Write-Host "ERROR: bash.exe not found at $bash"
            exit 1
          }
          Write-Host "Using bash at: $bash"
          & $bash -lc "pacman -Syu --noconfirm" || true
          & $bash -lc "pacman -Su --noconfirm" || true
          & $bash -lc "pacman -S --noconfirm mingw-w64-x86_64-toolchain mingw-w64-x86_64-qt6 mingw-w64-x86_64-qt6-base mingw-w64-x86_64-make"
          $mingwBin = Join-Path $msys "mingw64\bin"
          if (Test-Path $mingwBin) {
            "$mingwBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "Added $mingwBin to PATH"
          } else {
            Write-Host "Warning: $mingwBin not found after pacman install"
          }

      - name: Debug show qmake and toolchain (Windows)
        shell: cmd
        run: |
          where qmake || where qmake6 || echo qmake not found in PATH
          where mingw32-make || where make || echo make not found in PATH
          qmake -v || qmake6 -v || echo qmake -v failed

      - name: Build using mingw64 qmake and mingw32-make (Windows)
        shell: pwsh
        run: |
          $msys = "${{ steps.msys-path.outputs.msys }}"
          $qmake = Join-Path $msys "mingw64\bin\qmake.exe"
          $make = Join-Path $msys "mingw64\bin\mingw32-make.exe"
          Write-Host "qmake path: $qmake"
          Write-Host "make path: $make"
          if (-not (Test-Path $qmake)) { Write-Host "ERROR: qmake.exe not found at $qmake"; exit 1 }
          if (-not (Test-Path $make)) { Write-Host "ERROR: mingw32-make.exe not found at $make"; exit 1 }
          Push-Location $env:GITHUB_WORKSPACE
          if (-not (Test-Path "xcalc.pro")) { Write-Host "ERROR: xcalc.pro not found in repo root"; exit 1 }
          & $qmake -spec win32-g++ xcalc.pro
          & $make release
          Pop-Location

      - name: Verify built exe
        shell: cmd
        run: |
          if exist release\xcalc.exe (
            echo Found release\xcalc.exe
          ) else if exist build\release\xcalc.exe (
            echo Found build\release\xcalc.exe
          ) else if exist xcalc.exe (
            echo Found xcalc.exe in repo root
          ) else (
            echo ERROR: Built exe not found. Listing workspace: & dir %GITHUB_WORKSPACE% & exit /b 1
          )

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: xcalc-windows-x64
          path: |
            release/xcalc.exe
            build/release/xcalc.exe
            xcalc.exe
