name: Build xcalc for Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (jurplel)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          modules: 'qtbase'

      - name: Show workspace and Qt info
        shell: cmd
        run: |
          echo --- Environment ---
          python --version
          where python || echo "python not found"
          echo --- PATH ---
          echo %PATH%
          echo --- Qt folders ---
          if exist C:\Qt ( dir C:\Qt ) else ( echo "C:\Qt not found" )
          echo --- where qmake ---
          where qmake6 || where qmake || echo "qmake not found"
          qmake6 -v || qmake -v || echo "qmake -v failed"

      - name: Build with MinGW
        shell: cmd
        run: |
          REM Wenn qtenv2 vorhanden ist, laden
          if exist "C:\Qt\6.5.3\mingw_64\bin\qtenv2.bat" (
            call "C:\Qt\6.5.3\mingw_64\bin\qtenv2.bat"
          ) else (
            echo "qtenv2.bat not found, continuing"
          )
          REM Erzeuge Makefiles und baue
          qmake6 xcalc.pro || qmake xcalc.pro
          mingw32-make release || mingw32-make || make release
          dir release\

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: xcalc-windows
          path: release/xcalc.exe
