name: Build xcalc for Windows (MSYS2 + Qt6, final)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 (install and update)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-qt6
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-make

      - name: Ensure qmake present and show mingw64 bin (debug)
        shell: bash
        env:
          MSYSTEM: MINGW64
        run: |
          set -euo pipefail
          echo "=== /mingw64/bin listing ==="
          ls -la /mingw64/bin || true
          echo "=== try locating qmake binaries ==="
          command -v qmake6 || command -v qmake || true
          qmake6 -v 2>/dev/null || qmake -v 2>/dev/null || true
          echo "If qmake not found above, attempt explicit pacman install of qmake packages"
          pacman -Sy --noconfirm mingw-w64-x86_64-qt6 mingw-w64-x86_64-qt6-base mingw-w64-x86_64-qt6-tools || true
          echo "Post-install /mingw64/bin listing"
          ls -la /mingw64/bin | grep -i qmake || true
          command -v qmake6 || command -v qmake || true
          qmake6 -v 2>/dev/null || qmake -v 2>/dev/null || true

      - name: Find .pro and run qmake + make (mingw64)
        shell: bash
        env:
          MSYSTEM: MINGW64
        run: |
          set -euo pipefail

          # Convert Windows GITHUB_WORKSPACE to MSYS path reliably using cygpath
          if command -v cygpath >/dev/null 2>&1; then
            repo_msys="$(cygpath -u "${GITHUB_WORKSPACE}")"
          else
            # fallback conversion
            repo_win="${GITHUB_WORKSPACE}"
            if [[ "$repo_win" =~ ^[A-Za-z]:\\ ]]; then
              drive="${repo_win:0:1}"
              rest="${repo_win:2}"
              rest="${rest//\\//}"
              repo_msys="/${drive,,}/${rest}"
            else
              repo_msys="$repo_win"
            fi
          fi

          echo "MSYS repo path: $repo_msys"
          if [ ! -d "$repo_msys" ]; then
            echo "ERROR: repository path not found: $repo_msys"
            echo "PWD:"; pwd
            echo "Workspace listing:"; ls -la
            exit 1
          fi

          cd "$repo_msys"

          pro=$(ls *.pro 2>/dev/null | head -n1 || true)
          if [ -z "$pro" ]; then
            pro=$(find . -maxdepth 6 -type f -name '*.pro' | head -n1 || true)
          fi
          if [ -z "$pro" ]; then
            echo "ERROR: no .pro file found"
            exit 1
          fi

          echo "Found .pro: $pro"
          export PATH=/mingw64/bin:$PATH

          if command -v qmake6 >/dev/null 2>&1; then
            QMAKE=qmake6
          elif command -v qmake >/dev/null 2>&1; then
            QMAKE=qmake
          else
            echo "ERROR: qmake not found after installation attempts"
            echo "Listing /mingw64/bin for debugging:"; ls -la /mingw64/bin | head -n 200
            exit 1
          fi

          echo "Using $QMAKE"
          $QMAKE -v
          $QMAKE -spec win32-g++ "$pro" || { echo "qmake failed"; exit 1; }

          if command -v mingw32-make >/dev/null 2>&1; then
            MAKE=mingw32-make
          elif command -v make >/dev/null 2>&1; then
            MAKE=make
          else
            echo "ERROR: mingw32-make not found"
            exit 1
          fi

          echo "Using $MAKE"
          $MAKE release || { echo "make failed"; exit 1; }

      - name: Verify built exe (Windows)
        shell: cmd
        run: |
          if exist release\xcalc.exe (
            echo Found release\xcalc.exe
          ) else if exist build\release\xcalc.exe (
            echo Found build\release\xcalc.exe
          ) else if exist xcalc.exe (
            echo Found xcalc.exe in repo root
          ) else (
            echo ERROR: Built exe not found. Listing workspace: & dir %GITHUB_WORKSPACE% & exit /b 1
          )

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: xcalc-windows-x64
          path: |
            release/xcalc.exe
            build/release/xcalc.exe
            xcalc.exe
