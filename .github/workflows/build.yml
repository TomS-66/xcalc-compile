name: Build xcalc for Windows

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 1. Code auschecken
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. make installieren
      - name: Install make
        run: choco install make -y

      # 3. Qt 6.5.2 Offline-Installer herunterladen (✅ GETESTETE URL!)
      - name: Download Qt 6.5.2
        run: |
          Invoke-WebRequest -Uri "https://download.qt.io/archive/qt/6.5/6.5.2/qt-opensource-windows-x86_64-6.5.2.exe" -OutFile qt-installer.exe
        shell: pwsh

      # 4. Qt SILENT installieren (enthält MinGW 64-bit!)
      - name: Install Qt
        run: |
          Start-Process -Wait -FilePath .\qt-installer.exe -ArgumentList `
            "--silent", `
            "--accept-licenses", `
            "--accept-messagebox", `
            "--no-force-install", `
            "--install-dir", "C:\Qt\6.5.2\mingw_64"
        shell: pwsh

      # 5. Umgebung einrichten
      - name: Set up environment
        run: |
          echo "C:\Qt\6.5.2\mingw_64\bin" >> $GITHUB_PATH
        shell: pwsh

      # 6. Debug: Pfade prüfen
      - name: Debug paths
        run: |
          echo Arbeitsverzeichnis: %cd%
          where qmake6
          where make
          dir
        shell: cmd

      # 7. Kompilieren
      - name: Build
        run: |
          cd %GITHUB_WORKSPACE%
          call "C:\Qt\6.5.2\mingw_64\bin\qtenv2.bat"
          qmake6 xcalc.pro -spec win32-g++
          make release
        shell: cmd

      # 8. .exe hochladen
      - name: Upload executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xcalc-windows
          path: release/xcalc.exe
