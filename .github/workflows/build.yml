name: Build xcalc for Windows (Qt 5.15.2 MinGW ZIP)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Qt 5.15.2 MinGW herunterladen
      - name: Download Qt 5.15.2 MinGW
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://download.qt.io/official_releases/qt/5.15/5.15.2/qt-opensource-windows-x86_64-5.15.2-mingw81_64.zip" `
            -OutFile "qt.zip"

      # Entpacken
      - name: Extract Qt
        run: |
          7z x qt.zip -oQt

      # PATH setzen
      - name: Set up Qt environment
        shell: pwsh
        run: |
          echo "Qt/5.15.2/mingw81_64/bin" >> $env:GITHUB_PATH
          Get-ChildItem "Qt/5.15.2/mingw81_64/bin"

      # Build mit MinGW
      - name: Build with MinGW
        shell: cmd
        run: |
          qmake xcalc.pro -spec win32-g++
          mingw32-make release

      # Artefakt hochladen
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: xcalc-windows-mingw
          path: release/xcalc.exe
