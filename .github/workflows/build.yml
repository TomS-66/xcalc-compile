name: Build xcalc for Windows

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 1. Code auschecken
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. make installieren
      - name: Install make
        run: choco install make -y

      # 3. Qt installieren
      - name: Install Qt 6.7.0
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'

      # 4. Qt-Umgebung korrekt setzen
      - name: Set up environment
        shell: pwsh
        run: |
          echo "$env:QT_ROOT_DIR\bin" >> $GITHUB_PATH
          echo "Qt installed at: $env:QT_ROOT_DIR"
          Get-ChildItem "$env:QT_ROOT_DIR\bin"

      # 5. Kompilieren
      - name: Build
        shell: cmd
        run: |
          call "%QT_ROOT_DIR%\bin\qtenv2.bat"
          qmake6 xcalc.pro -spec win32-g++
          mingw32-make release

      # 6. .exe hochladen
      - name: Upload executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xcalc-windows
          path: release/xcalc.exe
