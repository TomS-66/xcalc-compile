name: Build xcalc for Windows (MinGW ZIP)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Qt 6.6.3 MinGW herunterladen
      - name: Download Qt 6.6.3 MinGW
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://download.qt.io/official_releases/qt/6.6/6.6.3/qt6.6.3-windows-Mingw_64-bit.zip" `
            -OutFile "qt.zip"

      # Entpacken
      - name: Extract Qt
        run: |
          7z x qt.zip -oQt

      # PATH setzen
      - name: Set up Qt environment
        shell: pwsh
        run: |
          echo "Qt/bin" >> $env:GITHUB_PATH
          echo "Qt/bin" >> $env:GITHUB_PATH
          Get-ChildItem "Qt/bin"

      # Build mit MinGW
      - name: Build with MinGW
        shell: cmd
        run: |
          qmake6 xcalc.pro -spec win32-g++
          mingw32-make release

      # Artefakt hochladen
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: xcalc-windows-mingw
          path: release/xcalc.exe
