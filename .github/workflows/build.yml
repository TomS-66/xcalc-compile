name: Build xcalc for Windows (MSYS2 + Qt via pacman)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MSYS2 and update
        shell: pwsh
        run: |
          choco install msys2 -y
          refreshenv
          $msys = "${env:ProgramFiles}\msys64"
          echo "MSYS2 installed to $msys"
          # Update pacman DB and core packages
          & "$msys\usr\bin\bash.exe" -lc "pacman -Syu --noconfirm" || true
          & "$msys\usr\bin\bash.exe" -lc "pacman -Su --noconfirm" || true

      - name: Install MinGW-w64 toolchain and Qt (mingw-w64-x86_64-qt6)
        shell: pwsh
        run: |
          $msys = "${env:ProgramFiles}\msys64"
          & "$msys\usr\bin\bash.exe" -lc "pacman -S --noconfirm mingw-w64-x86_64-toolchain mingw-w64-x86_64-qt6 mingw-w64-x86_64-qt6-base"
          # Add mingw64 bin to PATH for subsequent Windows steps
          $mingwBin = "$msys\mingw64\bin"
          "$mingwBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install make (choco)
        run: choco install make -y
        shell: pwsh

      - name: "Debug: show Qt and toolchain info"
        run: |
          echo PATH = %PATH%
          where qmake || where qmake6
          where mingw32-make || where make
          qmake -v || qmake6 -v
        shell: cmd

      - name: Build with qmake (release)
        run: |
          cd %GITHUB_WORKSPACE%
          if not exist xcalc.pro (
            echo "ERROR: xcalc.pro not found in repository root" & exit /b 1
          )
          REM If qmake is the mingw one, call it directly
          qmake -spec win32-g++
          mingw32-make release
        shell: cmd

      - name: Verify built exe
        run: |
          if exist release\xcalc.exe (
            echo "Found release\xcalc.exe"
          ) else if exist build\release\xcalc.exe (
            echo "Found build\release\xcalc.exe"
          ) else if exist xcalc.exe (
            echo "Found xcalc.exe in repo root"
          ) else (
            echo "ERROR: Built exe not found. Listing directory:" & dir & exit /b 1
          )
        shell: cmd

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: xcalc-windows-x64
          path: |
            release/xcalc.exe
            build/release/xcalc.exe
            xcalc.exe
