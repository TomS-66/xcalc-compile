name: Build xcalc for Windows

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 1. Code auschecken
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. make installieren
      - name: Install make
        run: choco install make -y

      # 3. Qt 6.7.0 installieren (AKTUELLE STABILE VERSION, Juli 2026)
      - name: Install Qt 6.7.0
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'  # ⭐ Neueste stabile Version
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          # ❌ modules: 'qtbase' WEGGELASSEN (verursacht XML-Fehler!)

      # 4. Umgebung einrichten
      - name: Set up environment
        run: |
          echo "$env:QT_ROOT_DIR\mingw_64\bin" >> $GITHUB_PATH
          echo "Qt installed at: $env:QT_ROOT_DIR"
          Get-ChildItem "$env:QT_ROOT_DIR\mingw_64\bin"
        shell: pwsh

      # 5. Kompilieren
      - name: Build
        run: |
          call "$env:QT_ROOT_DIR\mingw_64\bin\qtenv2.bat"
          qmake6 xcalc.pro -spec win32-g++
          make release
        shell: cmd

      # 6. .exe hochladen
      - name: Upload executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xcalc-windows
          path: release/xcalc.exe
