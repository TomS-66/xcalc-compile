name: Build xcalc for Windows (MSVC)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # MSVC-Toolchain aktivieren
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Qt für MSVC installieren (funktionierende Version!)
      - name: Install Qt 6.2.4 (MSVC)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.2.4'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc'

      # Debug: Qt-Pfade anzeigen
      - name: Show Qt installation
        shell: pwsh
        run: |
          echo "Qt installed at: $env:QT_ROOT_DIR"
          Get-ChildItem "$env:QT_ROOT_DIR\bin"

      # Build mit MSVC
      - name: Build with MSVC
        shell: cmd
        run: |
          call "%QT_ROOT_DIR%\bin\qtenv2.bat"
          qmake6 xcalc.pro -spec win32-msvc
          nmake
          dir .

      # Artefakt hochladen
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: xcalc-windows-msvc
          path: xcalc.exe
