name: Build xcalc for Windows (MSYS2 + Qt6, reliable)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 (install and update)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-qt6
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-make

      - name: Show qmake and toolchain (debug)
        shell: bash
        run: |
          echo "PATH: $PATH"
          which qmake6 || which qmake || true
          qmake6 -v 2>/dev/null || qmake -v 2>/dev/null || true
          which mingw32-make || which make || true

      - name: Find .pro and run qmake + make (mingw64)
        shell: bash
        env:
          MSYSTEM: MINGW64
        run: |
          set -euo pipefail
          # convert GITHUB_WORKSPACE to msys path
          repo_win="${GITHUB_WORKSPACE}"
          repo_msys="$(echo "$repo_win" | sed -E 's#^([A-Za-z]):#/\\L\\1#; s#\\\\#/#g')"
          echo "MSYS repo path: $repo_msys"
          cd "$repo_msys"
          pro=$(ls *.pro 2>/dev/null | head -n1 || true)
          if [ -z "$pro" ]; then
            pro=$(find . -maxdepth 6 -type f -name '*.pro' | head -n1 || true)
          fi
          if [ -z "$pro" ]; then
            echo "ERROR: no .pro file found"
            exit 1
          fi
          echo "Found .pro: $pro"
          export PATH=/mingw64/bin:$PATH
          if command -v qmake6 >/dev/null 2>&1; then QMAKE=qmake6; elif command -v qmake >/dev/null 2>&1; then QMAKE=qmake; else echo "ERROR: qmake not found"; exit 1; fi
          echo "Using $QMAKE"
          $QMAKE -spec win32-g++ "$pro"
          if command -v mingw32-make >/dev/null 2>&1; then MAKE=mingw32-make; elif command -v make >/dev/null 2>&1; then MAKE=make; else echo "ERROR: mingw32-make not found"; exit 1; fi
          echo "Using $MAKE"
          $MAKE release

      - name: Verify built exe (Windows)
        shell: cmd
        run: |
          if exist release\xcalc.exe (
            echo Found release\xcalc.exe
          ) else if exist build\release\xcalc.exe (
            echo Found build\release\xcalc.exe
          ) else if exist xcalc.exe (
            echo Found xcalc.exe in repo root
          ) else (
            echo ERROR: Built exe not found. Listing workspace: & dir %GITHUB_WORKSPACE% & exit /b 1
          )

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: xcalc-windows-x64
          path: |
            release/xcalc.exe
            build/release/xcalc.exe
            xcalc.exe
